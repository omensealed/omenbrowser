name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native Windows and macOS
    uses: ./.github/workflows/native-checks.yml

  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          workspaces: |
            .
            src/server

      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Dependency policy
        run: |
          cargo deny --locked --all-features check licenses bans sources
          cargo deny --manifest-path src/server/Cargo.toml --locked --all-features check licenses bans sources

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            jq \
            pkg-config \
            ripgrep \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Accepted build-time advisory boundary
        run: bash scripts/verify-accepted-advisories.sh

      - name: Release quick gate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/omen-release-quick-target
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: bash scripts/release-check.sh quick

      - name: Package script syntax
        run: |
          bash -n scripts/release-package.sh
          bash -n scripts/package-deb.sh
          bash -n scripts/package-appimage.sh
          bash -n scripts/package-linux-arm64-omenchatd.sh
          bash -n scripts/test-linux-arm64-headless.sh
          test -f scripts/package-windows-portable.ps1
          bash -n scripts/check-glibc-floor.sh
          bash -n scripts/verify-product-features.sh
          bash -n scripts/run-pinned-python-reticulum.sh
          bash -n scripts/run-mixed-0-6-0-9-lxmf.sh
          bash -n scripts/run-mixed-0-6-0-9-propagation.sh
          bash -n scripts/verify-tui-dependencies.sh
          bash -n scripts/test-tui-lifecycle.sh
          bash -n scripts/test-tui-real-pty.sh
          bash -n scripts/install-release.sh
          bash -n scripts/install-omenbrowser-user-launchers.sh
          bash -n scripts/install-omenchatd-user-service.sh
          bash scripts/verify-workflow-security.sh
