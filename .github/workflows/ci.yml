name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src/server

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Alpha quick gate
        run: bash scripts/alpha-check.sh quick

      - name: Package script syntax
        run: |
          bash -n scripts/alpha-package.sh
          bash -n scripts/package-deb.sh
          bash -n scripts/package-appimage.sh
          bash -n scripts/install-alpha.sh
          bash -n scripts/install-omenbrowser-user-launchers.sh
          bash -n scripts/install-omenchatd-user-service.sh
