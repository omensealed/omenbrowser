name: Package

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_package_smoke:
        description: "Run packaged local OMENchat smoke after release tarball build"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  native:
    name: Native release prerequisite
    uses: ./.github/workflows/native-checks.yml

  package:
    name: Build release artifacts
    needs: native
    runs-on: ubuntu-24.04
    container: rust:1-bullseye
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            src/server

      - name: Install Linux package dependencies
        run: |
          apt-get update
          apt-get install -y \
            appstream \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            jq \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install appimagetool
        env:
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -L \
            -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum --check --strict
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract >/dev/null
          mv squashfs-root /opt/appimagetool
          ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build release tarball
        run: bash scripts/release-package.sh dist

      - name: Check conservative Linux glibc compatibility
        run: |
          bash scripts/check-glibc-floor.sh 2.31 \
            target/release/omenbrowser_rs \
            src/server/target/release/omenchatd

      - name: Package release gate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_smoke == 'true' }}
        run: bash scripts/release-check.sh package dist/OMENbrowser_rs-latest.tar.gz

      - name: Build Debian package
        run: bash scripts/package-deb.sh dist

      - name: Build AppImage
        run: bash scripts/package-appimage.sh dist

      - name: Collect artifact checksums
        run: |
          sha256sum \
            dist/OMENbrowser_rs-latest.tar.gz \
            dist/omenbrowser-rs_*.deb \
            dist/OMENbrowser_rs-*.AppImage \
            | tee dist/release-artifacts.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omenbrowser-rs-release-artifacts
          path: |
            dist/OMENbrowser_rs-latest.tar.gz
            dist/OMENbrowser_rs-latest.tar.gz.sha256
            dist/OMENbrowser_rs-latest.txt
            dist/omenbrowser-rs_*.deb
            dist/omenbrowser-rs_*.deb.sha256
            dist/OMENbrowser_rs-*.AppImage
            dist/OMENbrowser_rs-*.AppImage.sha256
            dist/release-artifacts.sha256
          if-no-files-found: error

  windows-portable:
    name: Build Windows portable artifacts
    needs: native
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-11

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            src/server

      - name: Build and verify portable packages
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -OutDir dist

      - name: Upload Windows portable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omenbrowser-rs-windows-portable-artifacts
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release downloads
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package
      - windows-portable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download reviewed build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omenbrowser-rs-release-artifacts
          path: dist

      - name: Download reviewed Windows portable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omenbrowser-rs-windows-portable-artifacts
          path: dist

      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --latest --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --title "OMENbrowser_rs ${RELEASE_TAG#v}" \
              --notes "Public release package build for $RELEASE_TAG." \
              --latest
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
