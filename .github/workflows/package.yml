name: Package

on:
  workflow_dispatch:
    inputs:
      run_package_smoke:
        description: "Run packaged local OMENchat smoke after alpha tarball build"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src/server

      - name: Install Linux package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            curl \
            dpkg-dev \
            file \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install appimagetool
        run: |
          curl -L \
            -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract >/dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build alpha tarball
        run: bash scripts/alpha-package.sh dist

      - name: Package alpha gate
        if: ${{ inputs.run_package_smoke == 'true' }}
        run: bash scripts/alpha-check.sh package dist/OMENbrowser_rs-alpha-latest.tar.gz

      - name: Build Debian package
        run: bash scripts/package-deb.sh dist

      - name: Build AppImage
        run: bash scripts/package-appimage.sh dist

      - name: Collect artifact checksums
        run: |
          sha256sum \
            dist/OMENbrowser_rs-alpha-latest.tar.gz \
            dist/omenbrowser-rs_*.deb \
            dist/OMENbrowser_rs-*.AppImage \
            | tee dist/release-artifacts.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omenbrowser-rs-release-artifacts
          path: |
            dist/OMENbrowser_rs-alpha-latest.tar.gz
            dist/OMENbrowser_rs-alpha-latest.tar.gz.sha256
            dist/OMENbrowser_rs-alpha-latest.txt
            dist/omenbrowser-rs_*.deb
            dist/omenbrowser-rs_*.deb.sha256
            dist/OMENbrowser_rs-*.AppImage
            dist/OMENbrowser_rs-*.AppImage.sha256
            dist/release-artifacts.sha256
          if-no-files-found: error
