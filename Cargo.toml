[package]
name = "omenbrowser_rs"
version = "0.9.8-1"
edition = "2021"
rust-version = "1.85"
description = "OMENbrowser Rust Desktop/TUI"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/omensealed/omenbrowser"
repository = "https://github.com/omensealed/omenbrowser"
readme = "README.md"

[features]
default = []
mock-runtime = []
desktop-ui = ["dep:iced", "dep:rfd"]
desktop-svg = ["desktop-ui", "iced/svg"]
desktop-qr = ["desktop-ui", "iced/qr_code"]
desktop-markdown = ["desktop-ui", "iced/markdown"]
desktop-ui-test = ["desktop-ui", "iced/debug", "iced/tester", "iced/time-travel"]
desktop-widgets = ["desktop-ui", "dep:iced_aw"]
desktop-dnd = ["desktop-widgets", "dep:iced_drop"]
desktop-animations = ["desktop-ui", "dep:iced_anim"]
desktop-tables = ["desktop-ui", "dep:iced_table"]
tui = ["dep:crossterm", "dep:ratatui", "tokio/signal"]
native-reticulum = ["dep:reticulum-rs", "dep:rns_transport", "dep:rand_core", "dep:rmpv", "dep:hkdf", "dep:omen-ifac-tcp", "dep:tokio-util"]
# Removed legacy rns-net compatibility feature names are retained only so stale
# local commands fail with an explicit compile-time message instead of looking
# like a valid networking path.
native-rns-net = []
experimental-rns-net-stack = ["native-rns-net"]
native-lxmf = ["native-reticulum", "dep:lxmf"]
native-rpc = ["dep:rns_rpc"]
native-lxmf-sdk = ["native-lxmf", "native-rpc", "dep:lxmf_sdk"]
native-network = ["native-reticulum", "native-lxmf-sdk"]
live-reticulum = ["native-reticulum"]
live-lxmf = ["native-lxmf"]
live-network = ["native-network"]
legacy-live-rns-net = ["experimental-rns-net-stack"]
chat-client = ["desktop-ui", "dep:bzip2", "dep:reqwest", "dep:rmpv", "dep:rusqlite"]
chat-client-gif = ["chat-client", "dep:iced_gif"]
portable-sqlite = ["rusqlite?/bundled"]
chat-client-reticulum = ["chat-client-rns-clean"]
chat-client-rns-clean = ["chat-client", "native-network"]
chat-client-rns = ["chat-client-reticulum"]
chat-client-rns-legacy = ["chat-client", "experimental-rns-net-stack"]
chat-client-lxmf = ["chat-client", "native-lxmf-sdk"]
chat-client-popout = ["chat-client"]
# Replies/mentions, reactions, revisions, pins, and durable mutation support
# are always compiled for chat-client builds but remain explicit Link-negotiated
# protocol capabilities. The following product flags gate additional room
# policy/audit capabilities rather than enabling the core wire vocabulary.
# Capability-negotiated room policy projection. Server authorization remains
# unconditional, while legacy peers retain byte-exact four-field room values.
omenchat-announcement-rooms = []
# Capability-negotiated durable room slow-mode enforcement. Legacy peers retain
# byte-exact four-field room values and never receive implicit enforcement.
omenchat-slow-mode = []
# Non-product interoperability hooks for deterministic live qualification.
omenchat-slow-mode-qualification = ["omenchat-slow-mode"]
# Capability-negotiated per-room upload admission. Legacy peers retain their
# prior admission behavior and byte-exact room values.
omenchat-room-media-policy = ["omenchat-announcement-rooms", "omenchat-slow-mode"]
# Non-product deterministic GUI/process hooks for the production capability.
omenchat-room-media-policy-qualification = ["omenchat-room-media-policy"]
# Capability-negotiated, bounded, read-only moderation audit.
omenchat-moderation-audit = []
# Non-product process qualification for the real capability boundary.
omenchat-moderation-audit-qualification = ["omenchat-moderation-audit"]
# Non-product hook that forces only moderation-audit pages through Resource.
omenchat-moderation-audit-resource-qualification = ["omenchat-moderation-audit-qualification"]

# Canonical build identities. Release and packaging commands must use
# `--no-default-features --features desktop-product`; development profiles keep
# mock support explicit so it cannot leak into distributed binaries.
desktop-product = ["chat-client-reticulum", "chat-client-gif", "portable-sqlite", "desktop-qr", "omenchat-announcement-rooms", "omenchat-slow-mode", "omenchat-room-media-policy", "omenchat-moderation-audit"]
desktop-product-static-media = ["chat-client-reticulum", "portable-sqlite", "desktop-qr", "omenchat-announcement-rooms", "omenchat-slow-mode", "omenchat-room-media-policy", "omenchat-moderation-audit"]
desktop-dev = ["desktop-product", "mock-runtime"]
desktop-test = ["desktop-dev", "desktop-ui-test"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bzip2 = { version = "0.5.2", optional = true }
crossterm = { version = "0.29", optional = true }
directories = "5.0"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
iced = { version = "0.14", optional = true, default-features = false, features = ["canvas", "image", "tokio", "wgpu"] }
iced_anim = { version = "0.3.1", optional = true, default-features = false, features = ["widgets"] }
iced_aw = { version = "0.14.1", optional = true, default-features = false, features = ["badge", "card", "menu", "tabs", "tab_bar", "sidebar", "selection_list", "number_input", "labeled_frame"] }
iced_drop = { version = "0.2.37", optional = true, default-features = false, features = ["helpers"] }
iced_gif = { version = "0.14", optional = true, default-features = false, features = ["tokio"] }
iced_table = { version = "0.14.0", optional = true, default-features = false }
hkdf = { version = "0.12", optional = true }
lxmf = { version = "=0.9.8", optional = true, default-features = false, features = ["wire"] }
lxmf_sdk = { package = "lxmf-sdk", version = "=0.9.8", optional = true, default-features = false, features = ["std", "sdk-async", "rpc-backend"] }
omen-ifac-tcp = { path = "src/server/crates/omen-ifac-tcp", version = "=0.9.5-1", optional = true }
omenchat-protocol = { path = "src/server/crates/omenchat-protocol", version = "=0.1.0" }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rand_core = { version = "0.6.4", optional = true, features = ["getrandom"] }
reticulum-rs = { version = "=0.9.8", optional = true, default-features = false, features = ["core", "transport"] }
rns_transport = { package = "reticulum-rs-transport", version = "=0.9.8", optional = true }
rns_rpc = { package = "reticulum-rs-rpc", version = "=0.9.8", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "socks"] }
rfd = { version = "0.15", optional = true, default-features = false }
rmpv = { version = "1.3", optional = true }
rpassword = "=7.5.4"
rusqlite = { version = "0.37", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.37", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
unicode-width = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", optional = true, default-features = false, features = ["x11", "wayland"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[[example]]
name = "mixed_sqlite_history_probe"
path = "examples/mixed_sqlite_history_probe.rs"
required-features = ["chat-client"]

[[bin]]
name = "omen-reticulum-gateway"
path = "src/bin/omen_reticulum_gateway.rs"
required-features = ["native-reticulum"]

[profile.dev.package."*"]
opt-level = 1
