[workspace]

[package]
name = "omenchatd"
version = "0.6.0-1"
edition = "2021"
description = "Standalone OMENchat server"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/omensealed/omenbrowser"
repository = "https://github.com/omensealed/omenbrowser"
readme = "README.md"

[features]
default = []
# Removed legacy rns-net feature name retained only to produce a clear
# compile-time error for stale local commands.
live-rns-net = []
live-reticulum = ["dep:rand_core", "dep:reticulum-rs", "dep:rns_transport", "dep:tokio", "dep:tokio-util", "dep:hkdf", "dep:sha2"]
tui = ["dep:crossterm", "dep:ratatui"]
server-headless = ["live-reticulum"]
server-full = ["server-headless", "tui"]

[[bin]]
name = "omenchatd"
path = "src/main.rs"

[dependencies]
bzip2 = "0.5.2"
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rmpv = "1.3"
rpassword = "=7.5.4"
rand_core = { version = "0.6.4", optional = true, features = ["getrandom"] }
hkdf = { version = "0.12", optional = true }
reticulum-rs = { version = "0.6.0", optional = true, default-features = false, features = ["core", "transport"] }
rns_transport = { package = "reticulum-rs-transport", version = "0.6.0", optional = true }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.37", optional = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }
