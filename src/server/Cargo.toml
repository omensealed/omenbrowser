[workspace]
members = ["crates/omen-ifac-tcp", "crates/omenchat-protocol"]

[package]
name = "omenchatd"
version = "0.10.0-2"
edition = "2021"
rust-version = "1.85"
description = "Standalone OMENchat server"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/omensealed/omenbrowser"
repository = "https://github.com/omensealed/omenbrowser"
readme = "README.md"

[features]
default = []
# Removed legacy rns-net feature name retained only to produce a clear
# compile-time error for stale local commands.
live-rns-net = []
live-reticulum = ["dep:rand_core", "dep:reticulum-rs", "dep:rns_transport", "dep:tokio", "dep:tokio-util", "dep:omen-ifac-tcp", "dep:sha2"]
tui = ["dep:crossterm", "dep:ratatui"]
server-headless = ["live-reticulum", "omenchat-announcement-rooms", "omenchat-slow-mode", "omenchat-room-media-policy", "omenchat-moderation-audit"]
server-full = ["server-headless", "tui"]
# Replies/mentions, reactions, revisions, pins, and durable mutation support
# are always compiled for server builds but remain explicit Link-negotiated
# protocol capabilities. The following product flags gate additional room
# policy/audit capabilities rather than enabling the core wire vocabulary.
# Capability-negotiated room policy projection. Authorization remains active
# for every peer, including legacy peers that receive four-field room values.
omenchat-announcement-rooms = []
# Capability-negotiated durable room slow-mode enforcement. Legacy peers retain
# byte-exact four-field room values and never receive implicit enforcement.
omenchat-slow-mode = []
# Non-product interoperability hooks for deterministic live qualification.
omenchat-slow-mode-qualification = ["omenchat-slow-mode"]
# Capability-negotiated per-room upload admission. Legacy peers retain their
# prior admission behavior and byte-exact room values.
omenchat-room-media-policy = ["omenchat-announcement-rooms", "omenchat-slow-mode"]
# Non-product deterministic process hooks for the production capability.
omenchat-room-media-policy-qualification = ["omenchat-room-media-policy"]
# Capability-negotiated, bounded, read-only moderation audit.
omenchat-moderation-audit = []
# Non-product process qualification for the real capability boundary.
omenchat-moderation-audit-qualification = ["omenchat-moderation-audit"]
# Non-product hook that forces only moderation-audit pages through Resource.
omenchat-moderation-audit-resource-qualification = ["omenchat-moderation-audit-qualification"]

[[bin]]
name = "omenchatd"
path = "src/main.rs"

[dependencies]
bzip2 = "0.5.2"
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rmpv = "1.3"
rpassword = "=7.5.4"
rand_core = { version = "0.6.4", optional = true, features = ["getrandom"] }
omen-ifac-tcp = { path = "crates/omen-ifac-tcp", version = "=0.9.5-1", optional = true }
omenchat-protocol = { path = "crates/omenchat-protocol", version = "=0.2.0" }
reticulum-rs = { version = "=0.10.0", optional = true, default-features = false, features = ["core", "transport"] }
rns_transport = { package = "reticulum-rs-transport", version = "=0.10.0", optional = true }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.37", optional = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
# The explicit two-process Reticulum interoperability harness installs a
# redacting logger for the upstream crate's existing transport diagnostics.
log = "=0.4.29"
