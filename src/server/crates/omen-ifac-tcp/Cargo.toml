[package]
name = "omen-ifac-tcp"
version = "0.9.5-1"
edition = "2021"
rust-version = "1.85"
description = "Protocol-neutral Python-compatible IFAC TCP interface used by OMEN applications"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
hkdf = "0.12"
rns_transport = { package = "reticulum-rs-transport", version = "=0.9.5" }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.37", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
